async function saveQueue(){if(BUSY)return;const todo=Q.filter(q=>!q.skip&&!q.err&&!q.done);
 for(const q of todo){if(!q.m.category)return alert('Choose a category for '+q.file.name);if(q.det&&!q.m.brand)return alert('Choose the brand for '+q.file.name);if(q.post&&!S.brands.some(b=>b.name==q.m.brand)&&!confirm(`"${q.m.brand}" is not in Brands & Rates, so its GMV earns no commission until you add it. Continue?`))return}

  S.docs.unshift({id,fileId,hash:q.hash,name:q.file.name,size:q.file.size,mime:q.file.type,at:Date.now(),by:ME.name,...m,kind:q.det?q.det.kind:'',summary:q.det?q.det.summary:null,posted,uploadId:L.length?id:''});

 ${p?`<div class=k3>${k('GMV',P(p.gmv),dlt(p.gmv,pp&&pp.gmv))}${k('Orders',p.orders.toLocaleString(),dlt(p.orders,pp&&pp.orders))}${k('AOV',P(p.aov),dlt(p.aov,pp&&pp.aov))}${k('Refunds',P(p.refunds),`<small class="${p.refundRate>.15?'neg':''}"> ${pc(p.refundRate)}</small>`)}${k('Items sold',p.items.toLocaleString())}${k('Click → order',pc(p.conv))}</div>`:''}
 <div class=two><div>${p?`<div class=box><h3>GMV by channel</h3>${Object.entries(p.channels).map(([c,v])=>`<div class=m><span style="width:130px">${c}</span><i style="width:${v/mx*55}%"></i>${P(v)} <small style="color:var(--mut)">${pc(p.gmv?v/p.gmv:0)}</small></div>`).join('')}</div>
 <div class=box><h3>Top products</h3><table><tr><th>Product<th class=r>GMV<th class=r>Items<th class=r>Refunds</tr>${p.top.map(x=>`<tr><td style="white-space:normal">${esc(x.name)}<td class=r>${P(x.gmv)}<td class=r>${x.items}<td class=r>${P(x.refunds)}</tr>`).join('')}</table>
 <div class=bar style="margin:8px 0 0"><button class=g onclick="fullTable('${r.tt_products.id}')">${FT&&FT.id==r.tt_products.id?'Refresh':'Show'} all ${p.products} products</button></div></div>`:''}
 ${FT?`<div class=box><h3>${esc(FT.title)}</h3>${FT.html}</div>`:''}</div>
 <div>${t?`<div class=box><h3>Product card traffic</h3>${spark(t.daily)}<table><tr><td>Views / viewers<td class=r>${t.views.toLocaleString()} / ${t.viewers.toLocaleString()}<tr><td>Click-through (clicks ÷ views)<td class=r>${pc(t.ctr)}<tr><td>Cart → paid<td class=r>${pc(t.cartToPaid)}<tr><td>Card-attributed GMV<td class=r>${P(t.cardGmv)}<tr><td>Content-attributed GMV<td class=r>${P(t.contentGmv)}</table></div>`:''}
 ${pr?`<div class=box><h3>Promotions</h3><table><tr><td>Promotions with sales<td class=r>${pr.withSales} of ${pr.promos} (${pr.ongoing} ongoing)<tr><td>Discount given<td class=r>${P(pr.discount)}<tr><td>Promo-attributed GMV<td class=r>${P(pr.gmv)}<tr><td>Blended ROI (GMV ÷ discount)<td class="r ${pr.roi<2?'rv':''}">${pr.roi}×</table>
 <p class=n>Promo GMV double-counts orders that used several promotions, so it is higher than shop GMV. Use it to compare promotions, not as sales.</p>
 ${pr.lowRoi.length?`<h3 style="margin-top:10px">Lowest-ROI promotions (≥ ₱1,000 discount)</h3><table>${pr.lowRoi.map(x=>`<tr><td style="white-space:normal">${esc(x.name)}<td class=r>${P(x.discount)}<td class="r rv">${x.roi}×</tr>`).join('')}</table>`:''}</div>`:''}
 ${!t||!pr||!p?`<p class=n>Missing for this period: ${[!p&&'product list',!t&&'traffic',!pr&&'promotions'].filter(Boolean).join(', ')}.</p>`:''}</div></div>
 <div class=box><h3>History — ${esc(PB)}</h3><div class=sc style="border:0;margin:0"><table><tr><th>Period<th class=r>GMV<th class=r>Orders<th class=r>AOV<th class=r>Refund rate<th class=r>LIVE<th class=r>Creator<th class=r>Product card<th class=r>Video<th class=r>Promo discount<th class=r>Promo ROI<th class=r>Views<th class=r>CTR</tr>
 ${runs.map(x=>{const a=x.tt_products&&x.tt_products.summary,b=x.tt_promotions&&x.tt_promotions.summary,c=x.tt_traffic&&x.tt_traffic.summary,e='<td class="r c">—';return`<tr><td>${per(x)}${a?`<td class=r>${P(a.gmv)}<td class=r>${a.orders}<td class=r>${P(a.aov)}<td class=r>${pc(a.refundRate)}<td class=r>${P(a.live)}<td class=r>${P(a.creator)}<td class=r>${P(a.card)}<td class=r>${P(a.video)}`:e.repeat(8)}${b?`<td class=r>${P(b.discount)}<td class=r>${b.roi}×`:e.repeat(2)}${c?`<td class=r>${c.views.toLocaleString()}<td class=r>${pc(c.ctr)}`:e.repeat(2)}</tr>`}).join('')}</table></div></div>`}
async function fullTable(id){const d=S.docs.find(x=>x.id==id);try{stat('Loading stored file…');const r=FSP.detect(await fileWB(d));
 FT={id,title:'All products — '+per(d),html:`<div class=sc style="max-height:420px;overflow:auto;margin:0"><table><tr><th>Product<th class=r>GMV<th class=r>LIVE<th class=r>Creator<th class=r>Card<th class=r>Video<th class=r>Orders<th class=r>Items<th class=r>CTR<th class=r>Refunds</tr>${[...r.rows].sort((a,b)=>b.gmv-a.gmv).map(x=>`<tr><td title="${esc(x.name)}">${esc(x.name.replace(/^Discounted Best Selling Official Brand\s*/i,'').slice(0,60))}<td class=r>${P(x.gmv)}<td class=r>${P(x.live)}<td class=r>${P(x.creator)}<td class=r>${P(x.card)}<td class=r>${P(x.video)}<td class=r>${x.orders}<td class=r>${x.items}<td class=r>${pc(x.impressions?x.clicks/x.impressions:0)}<td class=r>${P(x.refunds)}</tr>`).join('')}</table></div>`};stat('Loaded');go()}catch(e){alert(e.message)}}

// ---- Weekly review (top of Dashboard) ----
function weekly(){const t=today(),w0=W||wk(t),w1=addD(w0,6),inW=d=>d&&d>=w0&&d<=w1,ws=[];for(let i=0;i<12;i++)ws.push(addD(wk(t),-7*i));
 const ups=S.docs.filter(d=>inW(dOf(d.at))),byCat={};ups.forEach(d=>byCat[d.category]=(byCat[d.category]||0)+1);
 const inv=(c)=>S.docs.filter(d=>d.category==c&&isOpen(d)),sum=a=>a.reduce((s,d)=>s+(+d.amount||0),0),pay=inv('Invoice (payable)'),rec=inv('Invoice (receivable)'),od=pay.filter(d=>d.due&&d.due<t),d7=pay.filter(d=>d.due&&d.due>=t&&d.due<=addD(t,7)),rod=rec.filter(d=>d.due&&d.due<t);
 const con=S.docs.filter(d=>isCon(d.category)&&d.cEnd&&isOpen(d)),c60=con.filter(d=>d.cEnd>=t&&d.cEnd<=addD(t,60)),cx=con.filter(d=>d.cEnd<t);
 const sw=S.sales.filter(r=>inW(r.date)),ow=S.opex.filter(r=>inW(r.date)),gw=sw.reduce((s,r)=>s+r.gross-r.discount-r.refund,0),ew=ow.reduce((s,r)=>s+r.amount,0);
 const brands=[...new Set(S.docs.filter(d=>d.kind).map(d=>d.brand))],snap=brands.map(b=>{const r=platRuns(b).filter(x=>x.tt_products&&x.start<=w1),a=r[0],p=r.find(x=>x!==a&&x.end<a.start);return a&&{b,a,s:a.tt_products.summary,ps:p&&p.tt_products.summary}}).filter(Boolean);
 const A=[];od.length&&A.push(`${od.length} payable invoice(s) overdue — ${P(sum(od))}`);rod.length&&A.push(`${rod.length} receivable invoice(s) overdue — ${P(sum(rod))} to collect`);d7.length&&A.push(`${d7.length} payable invoice(s) due in the next 7 days — ${P(sum(d7))}`);
 c60.forEach(d=>A.push(`Contract with ${esc(d.party||d.brand||d.name)} ends ${d.cEnd}`));cx.forEach(d=>A.push(`Contract with ${esc(d.party||d.brand||d.name)} ended ${d.cEnd} but is still marked ${esc(d.status||'open')}`));
 snap.forEach(({b,s})=>{if(s.refundRate>.15)A.push(`${esc(b)}: refunds are ${pc(s.refundRate)} of GMV (${P(s.refunds)})`)});
 brands.forEach(b=>{const last=Math.max(...S.docs.filter(d=>d.brand==b&&d.kind).map(d=>d.at));if(Date.now()-last>8*864e5)A.push(`No platform report uploaded for ${esc(b)} since ${dOf(last)}`)});
 S.docs.filter(d=>d.kind=='tt_promotions'&&d.summary&&d.summary.roi&&d.summary.roi<2).slice(0,3).forEach(d=>A.push(`${esc(d.brand)} promotions returned ${d.summary.roi}× on ${P(d.summary.discount)} discount (${per(d)})`));
 return`<div class=box><div class=bar style="margin:0 0 8px"><h3 style="margin:0 auto 0 0">Weekly review</h3>Week of <select onchange="W=this.value;go()">${ws.map(w=>`<option value=${w} ${w==w0?'selected':''}>${w} – ${addD(w,6)}</option>`).join('')}</select></div>
 <div class=k3><div class=k><small>Files uploaded this week</small><b>${ups.length}</b></div><div class=k><small>Payables open</small><b>${P(sum(pay))}</b></div><div class=k><small>Receivables open</small><b>${P(sum(rec))}</b></div><div class=k><small>Ledger sales dated this week</small><b>${P(gw)}</b></div><div class=k><small>Ledger expenses dated this week</small><b>${P(ew)}</b></div></div>
 <div class=two><div><h3>Needs attention</h3>${A.length?`<ul class=al>${A.map(a=>`<li>${a}</li>`).join('')}</ul>`:'<p class="n ok">Nothing overdue or expiring.</p>'}
 <h3 style="margin-top:12px">Received this week</h3><p class=n style="margin:0">${Object.entries(byCat).map(([c,n])=>`<span class=tag>${esc(c)} · ${n}</span>`).join('')||'No files uploaded in this week yet.'} <a class=l onclick="V='up';go()">Upload</a></p></div>
 <div><h3>Platform snapshot <small style="color:var(--mut);font-weight:400">latest report per brand</small></h3>${snap.length?`<table><tr><th>Brand<th>Period<th class=r>GMV<th class=r>Orders<th class=r>Refunds</tr>${snap.map(({b,a,s,ps})=>`<tr><td><a class=l onclick="V='plat';PB=${js(b)};go()">${esc(b)}</a><td class=c>${per(a)}<td class=r>${P(s.gmv)}${dlt(s.gmv,ps&&ps.gmv)}<td class=r>${s.orders}<td class="r ${s.refundRate>.15?'rv':''}">${pc(s.refundRate)}</tr>`).join('')}</table>`:'<p class=n>Upload platform reports to see brand performance here.</p>'}</div></div></div>`}

// ---- Team & Audit ----
let TEAM={users:null,audit:null,err:''};
async function tcall(b){const r=await fetch('/api/auth',{method:'POST',headers:{...H(),'content-type':'application/json'},body:JSON.stringify(b)}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error '+r.status);return j}
async function loadTeam(){if(!CLOUD||TEAM.users!==null)return;TEAM.users=[];try{TEAM.audit=(await tcall({action:'audit'})).items;if(ME.role=='owner')TEAM.users=(await tcall({action:'users'})).users}catch(e){TEAM.err=e.message}if(V=='team')go()}
async function tact(a,f,em){try{const b={action:a};if(f){b.email=f.email.value;b.name=f.name&&f.name.value;b.password=f.password&&f.password.value}else b.email=em;
 if(a=='remove'&&!confirm('Remove access for '+b.email+'?'))return;if(a=='reset'){b.password=prompt('New password for '+b.email+' (min 10 characters)');if(!b.password)return}
 await tcall(b);TEAM={users:null,audit:null,err:''};await loadTeam()}catch(e){alert(e.message)}}
function teamView(){if(!CLOUD)return'<div class=box><p class=n>Sign in to manage the finance team and see the audit trail.</p><button onclick="showLogin()">Sign in</button></div>';
 return`${ME.role=='owner'?`<div class=box><h3>Finance team access</h3><table><tr><th>Name<th>Email<th>Role<th>Added<th></tr>${(TEAM.users||[]).map(u=>`<tr><td>${esc(u.name)}<td>${esc(u.email)}<td>${esc(u.role)}<td class=c>${(u.added||'').slice(0,10)}<td><button class=g onclick="tact('reset',null,${js(u.email)})">Reset password</button> <button class="x g" onclick="tact('remove',null,${js(u.email)})">Remove</button></tr>`).join('')||'<tr><td colspan=5 class=c>No team members yet — only the owner password works.</tr>'}</table>
 <form class=fg onsubmit="event.preventDefault();tact('add',this);this.reset()"><label>Name<input name=name required></label><label>Email<input name=email type=email required></label><label>Temporary password (10+ chars)<input name=password minlength=10 required></label><label>&nbsp;<button>Add finance user</button></label></form>
 <p class=n>Each person signs in with their own email, so every upload and edit is attributed. Share the temporary password privately. The owner signs in with a blank email and the APP_PASSWORD.</p></div>`:''}
 <div class=box><h3>Audit trail <small style="color:var(--mut);font-weight:400">latest 150 events</small></h3>${TEAM.err?`<p class="n rv">${esc(TEAM.err)}</p>`:''}<div class=sc style="border:0;margin:0;max-height:520px;overflow:auto"><table><tr><th>When<th>Who<th>Action<th>Detail</tr>${(TEAM.audit||[]).map(a=>`<tr><td>${new Date(a.at).toLocaleString()}<td>${esc(a.by)}<td>${esc(a.action)}<td style="white-space:normal">${esc(a.detail)}</tr>`).join('')||'<tr><td colspan=4 class=c>Loading…</tr>'}</table></div></div>`}

go();boot();
